# 실측 경기장 지도 (2026-11-10). 벽 안쪽 2.00 x 1.00 m에 임시 물체 둘
# (sim/fleet_gz_sim/sites/arena_1110.yaml). 핑키 3대용. 관제는 자유바닥
# (floor_map_arena_1110.yaml)으로 돌고, 레인은 그 길을 그린 것이다.
#  - 바닥은 두 물체를 도는 고리 하나다. 로봇은 한 방향으로 돈다: 서쪽 끝에서 남쪽으로,
#    남쪽 통로를 동쪽으로, 동쪽 끝에서 북쪽으로, 북쪽 통로를 서쪽으로
#  - WORK(W)는 서쪽 끝 가운데(북쪽 QW에서 들어와 남쪽 WS로 나감), OUTBOUND(O)는 동쪽 끝
#    가운데(남쪽 QO에서 들어와 북쪽 ON으로 나감). 스테이션 자리는 정해진 것이 없어 가정이다
#  - 스테이션 선은 벽에서 0.45 m 안쪽이다. 벽과 선 사이가 주차 자리다: P-1, P-2는 서쪽 벽 앞,
#    P-3은 동쪽 벽 앞. 서 있는 로봇이 고리를 막지 않고, 칸끼리 0.40 m, 벽에서 0.19 m 떨어져 있다
#    (물체 옆에 두 칸을 0.25 m 간격으로 붙이거나 벽에서 0.13 m에 두면, 위치 잡음 3 cm에서
#    출발부터 잡지 않은 칸을 밟았다)
#
#   y
#  0.85        QW <--------------------------------- ON
#  0.70  P-2   v                                     ^
#  0.50        W     [west]      [east]              O    P-3
#  0.30  P-1   v                                     ^
#  0.15        WS ---------------------------------> QO
#       0.19  0.45  0.65-0.85  1.05-1.30            1.55  1.81  x
floor_map: floor_map_arena_1110.yaml  # free-floor map (traffic_mode freefloor), in fleet_core/data
half_width_m: 0.05    # 추정: 레인에서 이 거리까지는 레인 위로 친다
lane_entry_m: 0.25    # 레인 바닥이 시작되는 거리
origin_m: [0.0, 0.0]
# 양방향 쌍은 주차 칸 셋뿐이다. 묶지 않는다(figure8_arena와 같다)
bundle_two_way: false
waypoints:
  - {id: QW, x: 0.45, y: 0.85}     # WORK 대기 지점
  - {id: W, x: 0.45, y: 0.50}      # WORK 도크
  - {id: WS, x: 0.45, y: 0.15}     # 도크를 떠나 남쪽으로
  - {id: QO, x: 1.55, y: 0.15}     # OUTBOUND 대기 지점
  - {id: O, x: 1.55, y: 0.50}      # OUTBOUND 도크
  - {id: "ON", x: 1.55, y: 0.85}   # 도크를 떠나 북쪽으로
  - {id: P-1, x: 0.19, y: 0.30}    # 서쪽 벽 앞, 아래
  - {id: P-2, x: 0.19, y: 0.70}    # 서쪽 벽 앞, 위
  - {id: P-3, x: 1.81, y: 0.50}    # 동쪽 벽 앞
lanes:
  - {from: QW, to: W}
  - {from: W, to: WS}
  - {from: WS, to: QO}
  - {from: QO, to: O}
  - {from: O, to: "ON"}
  - {from: "ON", to: QW}
two_way:  # 주차 칸은 막다른 곳이라 같은 레인으로 들고 난다
  BAY1: [WS, P-1]
  BAY2: [QW, P-2]
  BAY3: ["ON", P-3]
stations:
  WORK: {dock: W, queue: [[QW, W]], commit: W, server: workcell, arms: [arm1, arm2], action: fill}
  OUTBOUND: {dock: O, queue: [[QO, O]], commit: O, server: arm3, arms: [arm3], action: swap}
# 주행 순서대로. 대기 로봇은 가장 깊은 빈 칸(P-2, QW 앞)으로 간다.
parking: [P-3, P-1, P-2]
