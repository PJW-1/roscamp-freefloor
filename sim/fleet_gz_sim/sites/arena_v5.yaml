# 실물 경기장 다섯 번째 배치 제안 (v5, 2026-11-11). 벽 안쪽 1.98 x 0.99 m와 물체 넷은 v4 그대로이고
# (물체 크기는 v4 스캔의 바깥 치수), 놓는 자리만 바꿨다. 아직 실물로 놓아 보지 않은 설계다.
#   - 좁은 틈을 없앴다: 로봇이 지나는 곳은 한 곳만 빼고 0.33 m 이상이다(v4는 0.17에서 0.26 m).
#     그 한 곳은 물체 4 선반의 모서리와 물체 1 사이(0.27 m, 길이 0.17 m쯤)로 한 대가 지난다.
#   - 가운데 줄에 작은 섬 둘(물체 1, 물체 3)만 둔다. 섬의 북쪽과 남쪽 통로는 0.41에서 0.43 m,
#     두 섬 사이 건너는 통로는 0.34 m다.
#   - 큰 물체 둘(물체 4, 물체 2)은 서쪽 구역의 북쪽 벽과 남쪽 벽에 붙인 선반이다.
#   - 자리는 v4 그대로다: 출고는 서쪽 벽 가운데, 작업 도크는 남동쪽 구석, 대기는 북동쪽.
# 레인은 표시와 거리 계산용이고 관제는 자유바닥(pc/fleet_core/fleet_core/data/floor_map_arena_v5.yaml)으로 돈다.
lane_map: arena_v5             # sim/fake_robots/maps/의 이름
lane_clearance_m: 0.08
bounds_m: [0.0, 0.0, 1.98, 0.99] # 벽 안쪽 면
boxes:
  - {name: object1, kind: block, x0: 0.52, y0: 0.42, x1: 0.69, y1: 0.58}  # 섬 (0.17 x 0.16)
  - {name: object3, kind: block, x0: 1.03, y0: 0.43, x1: 1.30, y1: 0.56}    # 섬 (0.27 x 0.13)
  - {name: object4, kind: block, x0: 0.0, y0: 0.85, x1: 0.51, y1: 0.99}     # 북쪽 벽 선반 (0.51 x 0.14)
  - {name: object2, kind: block, x0: 0.0, y0: 0.0, x1: 0.29, y1: 0.17}      # 남쪽 벽 선반 (0.29 x 0.17)
