# 얇은 진열대 배치 시험 (v6, 2026-11-11). 사용자의 맵 개념도(진열대 넷, 작업 구역 북서쪽, 출고 구역 동쪽,
# 대기 구역 남서쪽)를 그 방향 그대로 옮기고 진열대만 얇게 했다: 왼쪽 둘은 두께 0.10 m, 오른쪽 둘은 0.05 m
# (사용자 지정). 벽 안쪽은 실측 1.98 x 0.99 m. 실물로 놓아 본 적 없는 가정이다.
#   - 왼쪽 진열대 둘(0.10 x 0.26): 개념도의 가운데 자리를 지켰다. 서쪽 통로 0.37, 둘 사이 0.27,
#     가운데 통로 0.28, 북쪽(진열대 위) 0.23 m.
#   - 오른쪽 긴 진열대 둘(0.60 x 0.05): 북쪽 통로를 0.42 m(두 대가 나란히 설 수 있는 빈 줄 여덟)로
#     하고 남은 폭을 가운데 0.23, 남쪽 0.24 m로 나눴다. 동쪽 끝은 0.26 m.
# 레인은 표시와 거리 계산용이고 관제는 자유바닥(pc/fleet_core/fleet_core/data/floor_map_arena_v6.yaml)으로 돈다.
lane_map: arena_v6             # sim/fake_robots/maps/의 이름
lane_clearance_m: 0.08
bounds_m: [0.0, 0.0, 1.98, 0.99] # 벽 안쪽 면
boxes:
  - {name: shelf_a, kind: block, x0: 0.37, y0: 0.50, x1: 0.47, y1: 0.76}  # 왼쪽 진열대 (0.10 x 0.26)
  - {name: shelf_b, kind: block, x0: 0.74, y0: 0.50, x1: 0.84, y1: 0.76}  # 왼쪽 진열대 (0.10 x 0.26)
  - {name: shelf_n, kind: block, x0: 1.12, y0: 0.52, x1: 1.72, y1: 0.57}  # 오른쪽 긴 진열대, 북 (0.60 x 0.05)
  - {name: shelf_s, kind: block, x0: 1.12, y0: 0.24, x1: 1.72, y1: 0.29}  # 오른쪽 긴 진열대, 남 (0.60 x 0.05)
