# 얇은 진열대 배치(arena_v6)의 장애물 일정: 상자를 세 곳에 시간차로 놓았다 치운다(사용자 요청,
# 2026-11-11: 로봇이 여러 길로 다니게). 형식은 roam.yaml의 설명을 본다.
#   - SC->SM 가운데 (0.79, 0.25): 남서쪽 빈 바닥. 돌아오는 로봇이 상자 양옆으로 비켜 간다
#   - MC->MB 0.39 (1.24, 0.405): 긴 진열대 사이 통로의 서쪽. 로봇이 통로 안에서 돌아 나와 남쪽 통로로 간다
#     (동쪽 입구 가까이에 두면 출고 도크를 막 나온 로봇이 도크 앞에서 서서 기다리기만 한다: 관제가
#     로봇 앞 0.3 m를 몸 폭으로 막힌 칸으로 표시해 0.26 m 동쪽 끝이 통째로 막힌다. 머리 없는 시뮬)
#   - NC->NE 0.6 (1.29, 0.86): 북쪽 통로의 북쪽 벽 쪽. 로봇이 남쪽 줄로 비켜 간다
size_m: [0.12, 0.12, 0.25]
obstacles:
  - {at_s: 30, lane: [SC, SM], duration_s: 55}
  - {at_s: 60, lane: [MC, MB], fraction: 0.39, duration_s: 55}
  - {at_s: 105, lane: [NC, NE], fraction: 0.6, duration_s: 55}
  - {at_s: 150, lane: [MC, MB], fraction: 0.39, duration_s: 50}
  - {at_s: 185, lane: [SC, SM], duration_s: 50}
