# arena_v4에서 가운데 지름길(outbound_short)을 자주 쓰는 리허설: 핑키 2대, 주문 10건이 10초마다 들어온다.
# 2대면 출고 도크와 틈이 비어 있을 때가 많아, 출고로 가는 로봇이 갈림길 (0.97, 0.445)에서 물체 2와 3
# 사이로 꺾어 들어간다. 머리 없는 실행(2026-11-11, 씨앗 5개): 한 판에 지름길 5번, 지름길 없는 길보다
# 끝나는 시각이 2.2% 이르다(docs/worklog_freefloor_2026-11-11.md).
# 실행 명령과 지도는 gz_arena_v4.yaml과 같다:
#   ros2 launch fleet_gz_sim gz.launch.py scenario:=gz_arena_v4_two traffic_mode:=freefloor \
#       sim_dock_stub:=true fleet_params_file:=fleet_params_real_arena nav_max_speed:=0.15 \
#       nav_collision_check:=false
map: arena_v4
seed: 64
speed_factor: 5.0
timeout_s: 1200
stock: {arm1: {A: 20, B: 20}, arm2: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: R-001, items: {A: 1, C: 1}}
  - {at_s: 10, id: R-002, items: {B: 1}}
  - {at_s: 20, id: R-003, items: {D: 1, A: 1}}
  - {at_s: 30, id: R-004, items: {C: 1}}
  - {at_s: 40, id: R-005, items: {B: 1, D: 1}}
  - {at_s: 50, id: R-006, items: {A: 1}}
  - {at_s: 60, id: R-007, items: {C: 1, B: 1}}
  - {at_s: 70, id: R-008, items: {D: 1}}
  - {at_s: 80, id: R-009, items: {A: 1, B: 1}}
  - {at_s: 90, id: R-010, items: {C: 1}}
robots:
  pinky1: {start: P-3}
  pinky2: {start: P-2}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 10
  orders_partial: 0
  orders_held: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED, FLOOR_SHORTCUT]
