# Free-floor map for a trial layout with thin shelves ("v6", 2026-11-11): the user's concept
# drawing in its own orientation, the two shelves on the left 0.10 m thick and the two long ones
# on the right 0.05 m (the user's numbers). Never laid out in the real arena. arena_v6_fine.pgm is
# the 1 cm map the site generator writes from sim/fleet_gz_sim/sites/arena_v6.yaml. Coordinates
# are those of the lane map sim/fake_robots/maps/arena_v6.yaml, which names this file.
image: arena_v6_fine.pgm
resolution: 0.01
origin: [-0.15, -0.15, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
# Robot and margins as floor_map_arena_v5.yaml, cells of 0.02 m (0.03 there): the user asked for
# less to be locked around a robot (2026-11-11), and smaller cells round the lock up by less.
# Headless on this map, median width of the lock across a robot on a straight run / where it
# may turn: 0.24 / 0.27 m with 0.03 m cells, 0.22 / 0.26 m with 0.02 m. The margins stay:
# cell_margin_m 0.02 failed a Gazebo run on two early releases. The passage north of the long
# shelves is the widest (0.42 m), the west passage 0.37 m, the others 0.23 to 0.28 m.
cell_m: 0.02
robot_radius_m: 0.08
cell_margin_m: 0.03
robot_half_width_m: 0.06
side_margin_m: 0.02
wall_margin_m: 0.003
# WORK in the north-west corner, OUTBOUND at the middle of the east wall, parking along the south
# wall in the west (the last spot is the nearest to the way into WORK).
docks:
  WORK: [0.20, 0.88]
  OUTBOUND: [1.85, 0.50]
parking:
  - {id: P-1, x: 0.73, y: 0.11}
  - {id: P-2, x: 0.43, y: 0.11}
  - {id: P-3, x: 0.14, y: 0.11}
# The only lines are the last 0.23 m into each dock (the direction a robot comes in by). Shorter
# lines were tried because the user asked (0.17 and 0.18 m): in Gazebo a Pinky then took itself
# to have arrived where the line starts (it does within arrival_tolerance_m 0.15 m of its target,
# and its position was 3 cm off), was told to dock 0.156 m from the dock and failed. A line has
# to be longer than arrival_tolerance_m by more than the position error. WORK is entered from
# the south as on the drawing. OUTBOUND is entered from the north, not from the south as drawn:
# with free paths a robot coming by the north passage would drive past the dock down the 0.26 m
# east strip and turn round to come in. So the robots go round clockwise: north passage east,
# down through OUTBOUND, a south or the middle passage west, parking, up the west passage into
# WORK. Both docks are driven through, none is a dead end.
fixed_lines:
  work_in: [[0.20, 0.65], [0.20, 0.88]]
  outbound_in: [[1.85, 0.73], [1.85, 0.50]]
# Where a robot waits for its turn on a dock line (first free place in this order). For WORK the
# parking spots, nearest first. For OUTBOUND two places along the north wall in the wide passage.
wait_spots:
  work_in: [[0.14, 0.11], [0.43, 0.11], [0.73, 0.11]]
  outbound_in: [[1.51, 0.885], [1.21, 0.885], [0.73, 0.11], [0.43, 0.11]]
