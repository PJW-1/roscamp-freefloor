# arena_v4 양방향판(2026-11-11): 물체, 벽, 칸, 도크, 대기 자리는 floor_map_arena_v4.yaml 그대로다(같은
# 이미지). 다른 것은 선과 통로다. 사용자 문서 "자유바닥_개선_정리_2026-11-11" 3절:
#   - 한 방향 고정 선은 도킹 구간만 남긴다: work_in(그대로), 출고에 북쪽에서 들어가는 선(도크 위에서
#     도크까지), 출고에서 남쪽으로 나오는 선(도크에서 남서쪽 서쪽 넓은 곳까지).
#   - 나머지 통로는 양방향이다(passages). 통로마다 가운데 선(양쪽 물체·벽에서 같은 거리)을 적고,
#     몸이 그 선을 쓸고 가는 칸이 통로 칸이다. 한 대만 지나가는 폭이라 관제가 통로마다 방향 표시를
#     둔다: 마주 보고 들어가지 않는다(안전은 칸 잠금).
#   - line: true 통로는 로봇 중심이 설 칸(clear)이 없거나 거의 없다: 가운데 선을 탄다(양쪽으로).
#     물체 3 북쪽(0.17 m, clear 0칸)과 2·3 사이(물체 1과 2 사이 틈 포함, 0.20~0.21 m)다.
#   - 나머지(가운데 통로 둘, 물체 4 남쪽과 북쪽)는 clear 칸이 있어 A*가 칸 위로 지난다.
#   - 서쪽(출고)은 gap23과 north3 두 문으로만 나머지와 이어진다. 1·3 사이(지름길)는 쓰지 않는다.
# 가운데 통로는 2·3 사이 합류점(0.97, 0.445)에서 둘로 나눈다(mid_s, mid_n): 합류점으로 드나드는 로봇이
# 아래위 반쪽을 따로 쓴다. 좌표의 근거는 sim/fleet_gz_sim/sites/arena_v4.yaml의 물체와 벽이다.
image: arena_v4_fine.pgm
resolution: 0.01
origin: [-0.15, -0.15, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
cell_m: 0.03
robot_radius_m: 0.08
cell_margin_m: 0.03
robot_half_width_m: 0.06
side_margin_m: 0.02
wall_margin_m: 0.003
docks:
  WORK: [1.78, 0.17]
  OUTBOUND: [0.17, 0.52]
parking:
  - {id: P-1, x: 1.57, y: 0.87}
  - {id: P-2, x: 1.86, y: 0.87}
  - {id: P-3, x: 1.86, y: 0.58}
fixed_lines:
  work_in: [[1.50, 0.45], [1.78, 0.17]]
  outbound_in: [[0.17, 0.74], [0.17, 0.52]]
  outbound_out: [[0.17, 0.52], [0.17, 0.33], [0.26, 0.24]]
rolling_lines: [outbound_in, outbound_out]
# 점 순서는 방향 표시의 +쪽일 뿐이다(양쪽으로 다닌다). 문 둘은 서쪽 끝이 첫 점이다.
passages:
  # 가운데 통로: 물체 2·3 동쪽 면(0.85)과 물체 4 서쪽 면(1.08) 사이
  mid_s: {points: [[0.97, 0.125], [0.97, 0.445]]}
  mid_n: {points: [[0.97, 0.445], [0.97, 0.875]]}
  # 물체 4 남쪽(남쪽 벽 0.0과 물체 4 아래 0.25 사이), 물체 4 북쪽(물체 4 위 0.76과 북쪽 벽 0.99 사이)
  south4: {points: [[0.97, 0.125], [1.22, 0.125]]}
  north4: {points: [[0.97, 0.875], [1.22, 0.875]]}
  # 서쪽 넓은 곳 -> 물체 1과 2 사이 -> 물체 2와 3 사이 -> 가운데 통로 앞(outbound_out의 가운데 선)
  gap23:
    points: [[0.53, 0.268], [0.586, 0.274], [0.649, 0.432], [0.70, 0.445], [0.86, 0.445]]
    line: true
  # 서쪽 넓은 곳 -> 물체 3 북쪽(물체 3 위 0.82와 북쪽 벽 0.99 사이, 0.905) -> 가운데 통로 위
  north3:
    points: [[0.60, 0.885], [0.68, 0.905], [0.85, 0.905], [0.93, 0.885]]
    line: true
